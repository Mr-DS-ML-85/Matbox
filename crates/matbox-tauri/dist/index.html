<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATBOX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Courier New', monospace; background: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; }
    #output { flex: 1; overflow-y: auto; padding: 12px; white-space: pre-wrap; font-size: 14px; }
    #input-line { display: flex; border-top: 1px solid #333; }
    #prompt { padding: 10px 0 10px 12px; color: #569cd6; font-weight: bold; }
    #input { flex: 1; background: transparent; border: none; color: #d4d4d4; font-family: inherit; font-size: 14px; padding: 10px; outline: none; }
    .error { color: #f44747; }
    .result { color: #d4d4d4; }
  </style>
</head>
<body>
  <div id="output"><span style="color:#888;">MATBOX v0.1.0 — type MATLAB code and press Enter</span></div>
  <div id="input-line">
    <span id="prompt">>></span>
    <input id="input" type="text" autofocus spellcheck="false" />
  </div>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const prompt = document.getElementById('prompt');
    let multiline = '';

    async function execute(code) {
      const line = document.createElement('div');
      line.innerHTML = `<span style="color:#569cd6;">>> </span>${escapeHtml(code)}`;
      output.appendChild(line);

      try {
        const result = await window.__TAURI__.invoke('eval', { code });
        if (result) {
          const r = document.createElement('div');
          r.classList.add('result');
          r.innerHTML = `ans =<br>${escapeHtml(result)}`;
          output.appendChild(r);
        }
      } catch (e) {
        const err = document.createElement('div');
        err.classList.add('error');
        err.textContent = `Error: ${e}`;
        output.appendChild(err);
      }
      output.scrollTop = output.scrollHeight;
    }

    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const code = input.value.trim();
        input.value = '';
        if (!code) return;
        if (code === 'exit' || code === 'quit') { window.close(); return; }
        await execute(code);
      }
    });

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
